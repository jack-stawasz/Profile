<div class="home-content">
  <div class="home-grid">
    <div class="testimonials-section" id="testimonials-section">
      <div class="testimonials-header">
        <h2>Testimonials</h2>
      </div>
      <div class="testimonials-track-wrapper" id="testimonials-wrapper">
        <div class="testimonials-track" id="testimonials-track">
          <!-- Cards injected by JS -->
        </div>
      </div>
      <div class="testimonials-controls">
        <button class="testimonials-pause-btn" id="testimonials-pause" aria-label="Pause / resume scrolling">
        </button>
        <input type="range" class="testimonials-scrubber" id="testimonials-scrubber"
               min="0" max="1000" value="0" step="1" aria-label="Scroll position">
      </div>
    </div>
  </div>
</div>
